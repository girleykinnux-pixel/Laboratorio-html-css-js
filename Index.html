<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Contador Dinámico</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="contenedor-contador">
        <h1 id="numero-contador">0</h1>

        <div class="botones-container">
            <button type="button" class="btn btn-decrementar" onclick="decrementar()">- Decrementar</button>
            <button type="button" class="btn btn-incrementar" onclick="incrementar()">+ Incrementar</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
